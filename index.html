<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Evacuation System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1> Disaster Evacuation System</h1>
        <div class="subtitle">Autonomous Disaster Evacuation — Algorithm Visualizer</div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="scenario">SCENARIO</label>
            <select id="scenario">
                <option value="flood">Flood</option>
                <option value="fire">Fire</option>
                <option value="earthquake">Earthquake</option>
                <option value="tsunami">Tsunami</option>
                <option value="meteor">Meteor</option>
                <option value="random">Random</option>
            </select>
        </div>
        <div class="control-group">
            <label for="algorithm">ALGORITHM</label>
            <select id="algorithm">
                <option value="bfs">BFS — Breadth First</option>
                <option value="dfs">DFS — Depth First</option>
                <option value="dls">DLS — Depth Limited</option>
                <option value="ucs">UCS — Uniform Cost</option>
                <option value="greedy">Greedy Best First</option>
                <option value="astar">A* — Optimal</option>
            </select>
        </div>

        <div class="control-group slider-container">
            <label for="speed">SPEED</label>
            <input type="range" id="speed" min="1" max="10" value="7">
        </div>

        <div class="control-buttons">
            <button id="reset-btn">Reset</button>
            <button id="run-btn">START EVACUATION ➔</button>
        </div>
    </div>

    <div class="status-bar" id="status-bar">SCENARIO LOADED — flood — rising water from east</div>

    <div class="stats">
        <div class="stat"><span class="label">Explored</span><span class="value" id="stat-explored">000</span></div>
        <div class="stat"><span class="label">Route Length</span><span class="value" id="stat-length">—</span></div>
        <div class="stat"><span class="label">Algorithm</span><span class="value" id="stat-algo">BFS</span></div>
        <div class="stat"><span class="label">Status</span><span class="value status-ready"
                id="stat-status">READY</span></div>
    </div>

    <div class="maze-container">
        <div id="grid"></div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="box start"></div><span>Civilian</span>
        </div>
        <div class="legend-item">
            <div class="box end"></div><span>Shelter</span>
        </div>
        <div class="legend-item">
            <div class="box hazard"></div><span>Hazard</span>
        </div>
        <div class="legend-item">
            <div class="box queued"></div><span>Queued</span>
        </div>
        <div class="legend-item">
            <div class="box exploring"></div><span>Exploring</span>
        </div>
        <div class="legend-item">
            <div class="box path"></div><span>Evac Route</span>
        </div>
        <div class="legend-item">
            <div class="box wall"></div><span>Blocked</span>
        </div>
    </div>
    <script src="core.js"></script>
</body>

</html>
